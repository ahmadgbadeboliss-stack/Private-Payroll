# Deploy the frontend to GitHub Pages as the live demo.
#
# The contract's proving keys are gitignored (149 MB) and are regenerated by
# compiling the Compact contract, so this workflow compiles the contract
# before building — the same pipeline as ci.yml — then publishes `dist/`.
# VITE_PUBLIC_BASE makes the built assets and ZK-artifact URLs work under the
# repository subdirectory (/Private-Payroll/).
#
# NOTE: the network stays Midnight **preview** (per the build brief). This is
# a static frontend deployment only — the contract is NOT redeployed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compile · Test · Build · Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - name: Compile Compact contract
        run: npm run compile

      - name: Run tests (contract circuits)
        run: npm test

      - name: Build frontend (GitHub Pages base path)
        env:
          VITE_PUBLIC_BASE: /Private-Payroll/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
